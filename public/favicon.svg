<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fluidwebsoft">
  <defs>
    <linearGradient id="g" x1="0" y1="10" x2="64" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.45" stop-color="#3b9df8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Dark background -->
  <rect width="64" height="64" rx="16" fill="#07090d"/>
  <!-- Subtle border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="url(#g)" stroke-opacity="0.3" stroke-width="2"/>
  <!-- Stylized F — top arc flowing right -->
  <path d="M20 16 C20 16, 44 14, 46 22 C48 30, 34 28, 34 28" fill="none" stroke="url(#g)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- F stem — fluid vertical stroke -->
  <path d="M22 16 L22 48" fill="none" stroke="url(#g)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- F mid bar — sweeping curve -->
  <path d="M22 33 C30 33, 38 30, 42 36" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
  <!-- Accent dot — glowing -->
  <circle cx="46" cy="22" r="3.5" fill="url(#g)" filter="url(#glow)" opacity="0.9"/>
</svg>
